cus on 2034 Olympics", "changed_text": "Latest headlines: Johnson faces tough road when bills that split GOP return to House Pedestrian critically injured after being struck by vehicle in South Salt Lake Canyons School District tables elementary school consolidation plans after heated meeting ‘It will ruin my life’: Roy residents speak out against proposed property tax increase UHP officer threatened by man with knife, witness helps tackle suspect to the ground"}];
  const PER_PAGE = 20;
  let page = 1;

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function highlight(text, q) {
    if (!q) return esc(text);
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    return esc(text).replace(re.source, (_, m) => `<mark>${m}</mark>`);
  }

  function friendlyDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
    } catch(e) { return iso; }
  }

  function renderCard(ev, q) {
    const isRemoved = ev.event_type === 'removed_or_taken_down';
    const badge = isRemoved
      ? '<span class="badge badge-removed">Removed</span>'
      : '<span class="badge badge-edited">Edited</span>';

    let diff;
    if (isRemoved) {
      diff = `<div class="removed-block">
        <p class="removed-label">Article removed from source</p>
        <pre class="pre-del">${highlight(ev.original_text, q)}</pre>
      </div>`;
    } else {
      diff = `<div class="diffgrid">
        <div><p class="diff-label orig-label">Before</p><pre class="pre-del">${highlight(ev.original_text, q)}</pre></div>
        <div><p class="diff-label new-label">After</p><pre class="pre-ins">${highlight(ev.changed_text, q)}</pre></div>
      </div>`;
    }

    return `<article class="event">
      <div class="event-header">
        ${badge}
        <span class="outlet-tag">${esc(ev.outlet)}</span>
        <span class="event-date">${friendlyDate(ev.date)}</span>
      </div>
      <a class="event-url" href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.url)}</a>
      ${diff}
    </article>`;
  }

  function applyFilters() {
    const q      = document.getElementById('q').value.trim().toLowerCase();
    const outlet = document.getElementById('outlet-filter').value;
    const type   = document.getElementById('type-filter').value;
    const from   = document.getElementById('date-from').value;
    const to     = document.getElementById('date-to').value;

    return ALL_EVENTS.filter(ev => {
      if (outlet && ev.outlet !== outlet) return false;
      if (type   && ev.event_type !== type) return false;
      if (from   && ev.date.slice(0,10) < from) return false;
      if (to     && ev.date.slice(0,10) > to)   return false;
      if (q) {
        const hay = (ev.url + ' ' + ev.original_text + ' ' + ev.changed_text).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function render() {
    const filtered = applyFilters();
    const q = document.getElementById('q').value.trim().toLowerCase();
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    if (page > pages) page = pages;

    const slice = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

    // Status bar
    const totalAll = ALL_EVENTS.length;
    document.getElementById('status-bar').textContent =
      total === totalAll
        ? `${totalAll} event${totalAll !== 1 ? 's' : ''} recorded`
        : `${total} of ${totalAll} event${totalAll !== 1 ? 's' : ''} match`;

    // Cards
    const list = document.getElementById('events-list');
    if (slice.length === 0) {
      list.innerHTML = '<p class="empty-note">No events match the current filters.</p>';
    } else {
      list.innerHTML = slice.map(ev => renderCard(ev, q)).join('');
    }

    // Pagination
    const pg = document.getElementById('pagination');
    if (pages <= 1) { pg.innerHTML = ''; return; }

    let btns = '';
    btns += `<button class="page-btn" ${page===1?'disabled':''} onclick="goPage(${page-1})">‹ Prev</button>`;
    for (let i = 1; i <= pages; i++) {
      if (pages > 9 && Math.abs(i - page) > 2 && i !== 1 && i !== pages) {
        if (i === 2 || i === pages-1) btns += '<span style="color:var(--muted)">…</span>';
        continue;
      }
      btns += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    btns += `<button class="page-btn" ${page===pages?'disabled':''} onclick="goPage(${page+1})">Next ›</button>`;
    pg.innerHTML = btns;
  }

  function goPage(n) { page = n; render(); window.scrollTo({top:0, behavior:'smooth'}); }

  function resetFilters() {
    document.getElementById('q').value = '';
    document.getElementById('outlet-filter').value = '';
    document.getElementById('type-filter').value = '';
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    page = 1;
    render();
  }

  ['q','outlet-filter','type-filter','date-from','date-to'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { page = 1; render(); });
  });
  document.getElementById('btn-reset').addEventListener('click', resetFilters);

  render();
  </script>
